  <polyline points="40,440 140,430 240,415 340,420 440,400 540,405 640,395"
            fill="none" stroke="#D98E2B" stroke-width="2.5" stroke-dasharray="4 4"/>
  <line x1="40" y1="446" x2="700" y2="446" stroke="#E5E1D8"/>
