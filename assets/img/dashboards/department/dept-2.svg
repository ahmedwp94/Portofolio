<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace">
  <rect width="800" height="500" fill="#FCFBF8"/>
  <text x="24" y="40" fill="#12151A" font-size="14" font-weight="700">Department Backlog &amp; Trend Tracker</text>
  <rect x="24" y="64" width="752" height="400" rx="6" fill="#FFFFFF" stroke="#E5E1D8"/>
  <line x1="40" y1="104" x2="760" y2="104" stroke="#E5E1D8"/>
  <text x="40" y="96" fill="#6B7280" font-size="10" letter-spacing="1">INITIATIVE</text>
  <text x="420" y="96" fill="#6B7280" font-size="10" letter-spacing="1">OWNER</text>
  <text x="540" y="96" fill="#6B7280" font-size="10" letter-spacing="1">TREND</text>
  <text x="660" y="96" fill="#6B7280" font-size="10" letter-spacing="1">STATUS</text>

  <g font-size="12" fill="#12151A">
    <text x="40" y="130">Vendor SLA Dashboard</text>
    <text x="420" y="130" fill="#6B7280">M. Aziz</text>
    <polyline points="540,132 555,126 570,130 585,120 600,124" fill="none" stroke="#0E7C86" stroke-width="2"/>
    <rect x="660" y="118" width="66" height="18" rx="9" fill="#0E7C86" opacity="0.15"/>
    <text x="670" y="131" fill="#0E7C86" font-size="10">GREEN</text>
  </g>
  <line x1="40" y1="150" x2="760" y2="150" stroke="#F1EFE9"/>

  <g font-size="12" fill="#12151A">
    <text x="40" y="176">Regional Rollout — Phase 2</text>
    <text x="420" y="176" fill="#6B7280">S. Noor</text>
    <polyline points="540,178 555,182 570,172 585,180 600,176" fill="none" stroke="#D98E2B" stroke-width="2"/>
    <rect x="660" y="164" width="66" height="18" rx="9" fill="#D98E2B" opacity="0.18"/>
    <text x="672" y="177" fill="#D98E2B" font-size="10">AMBER</text>
  </g>
  <line x1="40" y1="196" x2="760" y2="196" stroke="#F1EFE9"/>

  <g font-size="12" fill="#12151A">
    <text x="40" y="222">Reporting Standardization</text>
    <text x="420" y="222" fill="#6B7280">H. Fares</text>
    <polyline points="540,224 555,220 570,222 585,214 600,216" fill="none" stroke="#0E7C86" stroke-width="2"/>
    <rect x="660" y="210" width="66" height="18" rx="9" fill="#0E7C86" opacity="0.15"/>
    <text x="670" y="223" fill="#0E7C86" font-size="10">GREEN</text>
  </g>
  <line x1="40" y1="242" x2="760" y2="242" stroke="#F1EFE9"/>

  <g font-size="12" fill="#12151A">
    <text x="40" y="268">Data Quality Cleanup</text>
    <text x="420" y="268" fill="#6B7280">R. Idris</text>
    <polyline points="540,270 555,268 570,274 585,272 600,278" fill="none" stroke="#9AA1AC" stroke-width="2"/>
    <rect x="660" y="256" width="66" height="18" rx="9" fill="#6B7280" opacity="0.18"/>
    <text x="668" y="269" fill="#6B7280" font-size="10">PAUSED</text>
  </g>

  <text x="40" y="330" fill="#6B7280" font-size="11" letter-spacing="1">CAPACITY vs DEMAND — NEXT 6 SPRINTS</text>
  <polyline points="40,420 140,400 240,410 340,380 440,390 540,360 640,370"
